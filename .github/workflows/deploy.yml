name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging-directonderweg'
        type: choice
        options:
          - staging-directonderweg
          - production-directonderweg

# One deploy at a time per target environment. Later runs queue (no
# cancel-in-progress): a deploy must never be killed mid-SSH-script.
concurrency:
  group: deploy-${{ inputs.environment || 'production-directonderweg' }}
  cancel-in-progress: false

jobs:
  # Release gate: the full per-client CI matrix must be green on this exact
  # SHA before anything touches the server. A red suite blocks the tag.
  test:
    name: Release gate (CI suite)
    uses: ./.github/workflows/ci.yml

  deploy:
    # Tag push → production; workflow_dispatch → use the input choice.
    name: Deploy to ${{ inputs.environment || 'production-directonderweg' }}
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment || 'production-directonderweg' }}

    env:
      TARGET_ENV: ${{ inputs.environment || 'production-directonderweg' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env from secrets
        run: |
          cat > .env <<'ENVEOF'
          APP_NAME="${{ vars.APP_NAME || 'Direct Onderweg' }}"
          APP_CLIENT=${{ vars.APP_CLIENT || 'directonderweg' }}
          APP_ENV=${{ vars.APP_ENV || 'production' }}
          APP_DEBUG=false
          APP_URL=${{ vars.APP_URL }}
          APP_KEY=${{ secrets.APP_KEY }}

          # perf-audit F-23: config/inertia.php defaults SSR to ON, but no SSR
          # service exists on any host — every full-page load would pay a
          # connection attempt to 127.0.0.1:13714 before falling back to CSR.
          # Keep false until an SSR service is actually provisioned.
          INERTIA_SSR_ENABLED=false

          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          CACHE_STORE=${{ vars.CACHE_STORE || 'redis' }}
          SESSION_DRIVER=${{ vars.SESSION_DRIVER || 'redis' }}
          QUEUE_CONNECTION=${{ vars.QUEUE_CONNECTION || 'redis' }}
          REDIS_HOST=${{ vars.REDIS_HOST || '127.0.0.1' }}
          REDIS_PORT=${{ vars.REDIS_PORT || '6379' }}

          MAIL_MAILER=smtp
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ vars.MAIL_PORT || '587' }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_ENCRYPTION=tls
          MAIL_FROM_ADDRESS=${{ vars.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME="${{ vars.APP_NAME || 'Direct Onderweg' }}"

          NOCAPTCHA_SITEKEY=${{ secrets.NOCAPTCHA_SITEKEY }}
          NOCAPTCHA_SECRET=${{ secrets.NOCAPTCHA_SECRET }}

          SENTRY_LARAVEL_DSN=${{ secrets.SENTRY_LARAVEL_DSN }}
          SENTRY_ENVIRONMENT=${{ vars.SENTRY_ENVIRONMENT }}
          SENTRY_RELEASE=${{ github.sha }}

          TELESCOPE_ENABLED=false
          DEBUGBAR_ENABLED=false
          ENVEOF

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Copy .env and built assets to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || '22' }}
          source: ".env,public/build"
          target: ${{ vars.DEPLOY_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || '22' }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH }}

            echo "==> Previous commit: $(git rev-parse HEAD)"

            echo "==> Pulling latest code"
            git fetch origin
            git checkout ${{ github.sha }}

            echo "==> Installing PHP dependencies"
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            echo "==> Enabling maintenance mode"
            php artisan down --retry=5

            echo "==> Backing up database (pre-migrate safety net, keeps last 7)"
            DB_DATABASE=$(grep '^DB_DATABASE=' .env | cut -d= -f2-)
            DB_USERNAME=$(grep '^DB_USERNAME=' .env | cut -d= -f2-)
            DB_HOST_VAL=$(grep '^DB_HOST=' .env | cut -d= -f2-)
            export MYSQL_PWD=$(grep '^DB_PASSWORD=' .env | cut -d= -f2-)
            mkdir -p ~/backups
            mysqldump --single-transaction --quick -h "$DB_HOST_VAL" -u "$DB_USERNAME" "$DB_DATABASE" \
              | gzip > ~/backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz \
              || { echo "DB backup failed — aborting deploy"; php artisan up; exit 1; }
            unset MYSQL_PWD
            ls -t ~/backups/pre-deploy-*.sql.gz | tail -n +8 | xargs -r rm --

            echo "==> Running migrations"
            php artisan migrate --force || { php artisan up; exit 1; }

            echo "==> Seeding client branding (idempotent)"
            php artisan client:install

            echo "==> Caching config + routes + views"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "==> Restarting queue workers"
            php artisan queue:restart

            echo "==> Disabling maintenance mode"
            php artisan up

            echo "==> Done ✓ (${{ github.sha }})"

      - name: Post-deploy health check
        run: |
          # /login is unauthenticated and renders the full Inertia shell, so a
          # 200 here proves PHP, the DB connection, and the asset build are up.
          # 3 attempts, 10s apart, to ride out a cold opcache/config cache.
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 "${{ vars.APP_URL }}/login")
            if [ "$code" = "200" ]; then
              echo "Health check passed (HTTP $code)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code — retrying in 10s"
            sleep 10
          done
          echo "::error::Health check FAILED after deploy — site is returning HTTP $code. Roll back by re-running the workflow on the previous good tag."
          exit 1
